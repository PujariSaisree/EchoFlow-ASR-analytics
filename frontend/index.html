<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoFlow — Speech Intelligence Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <template id="page-template">
    <div class="page-head">
      <div>
        <h2>Speech Intelligence Overview</h2>
        <p>EchoFlow converts unstructured audio into structured KPIs, visual patterns, and decision-support observations.</p>
      </div>
      <a class="btn" href="/transcriptions">Analyze recording</a>
    </div>
    <section class="kpis" id="kpis"></section>
    <section class="grid-2">
      <article class="card">
        <h3>Speech rate</h3>
        <canvas id="wpmChart" height="140"></canvas>
      </article>
      <article class="card">
        <h3>Silence ratio</h3>
        <canvas id="silenceChart" height="140"></canvas>
      </article>
    </section>
    <section class="card" style="margin-top:16px">
      <h3>Recent recordings</h3>
      <div id="recent"></div>
    </section>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/layout.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
